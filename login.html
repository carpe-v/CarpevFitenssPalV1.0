<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autentificare & Înregistrare</title>
  <link rel="stylesheet" href="style.css" />
   <link rel="icon" href="data:," />
</head>
<body>
  <div class="auth-container">
    <h2 id="form-title">Autentificare</h2>

    <form id="auth-form">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="nume@exemplu.ro" />
      </div>

      <div class="input-group">
        <label for="password">Parolă</label>
        <input type="password" id="password" required minlength="6" placeholder="Minim 6 caractere" />
      </div>

      <button type="submit" id="submit-btn">Intră în cont</button>
    </form>

    <p id="message" class="message"></p>

    <p class="toggle-text">
      <span id="toggle-prompt">Nu ai cont?</span>
      <a href="#" id="toggle-mode">Înregistrează-te</a>
    </p>
  </div>

  <script type="module" src="./login.js"></script>
</body>
</html>
